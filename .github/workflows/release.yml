name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_icons.py
      - run: python scripts/validate_pack.py
      - run: python scripts/build_previews.py
      - run: python scripts/package_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*"$GITHUB_REF_NAME"* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*"$GITHUB_REF_NAME"* --generate-notes --title "UK Emergency Response Icons Reborn 2026 $GITHUB_REF_NAME"
          fi
