name: Publish release

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_icons.py
      - run: python scripts/validate_pack.py
      - run: python scripts/build_previews.py
      - run: python scripts/package_release.py
        env:
          PACK_VERSION: ${{ steps.release.outputs.version }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*"v${RELEASE_TAG#v}"* --clobber
          else
            gh release create "$RELEASE_TAG" dist/*"v${RELEASE_TAG#v}"* --target "$GITHUB_SHA" --generate-notes --title "UK Emergency Response Icons Reborn 2026 $RELEASE_TAG"
          fi
