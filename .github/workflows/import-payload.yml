name: Import validated v1.0.0 payload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand checksum-locked payload
        run: |
          mkdir imported
          unzip -q uk-emergency-response-icons-reborn-2026-payload.zip -d imported
          rsync -a imported/ ./
          rm -rf imported uk-emergency-response-icons-reborn-2026-payload.zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_pack.py
      - name: Publish imported tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release UK Emergency Response Icons Reborn 2026 v1.0.0"
          git push origin HEAD:main
