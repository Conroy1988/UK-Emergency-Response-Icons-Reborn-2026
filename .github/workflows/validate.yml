name: Validate mission icon pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_icons.py
      - run: python scripts/validate_pack.py
      - run: python scripts/build_previews.py
      - name: Assert deterministic tree
        run: git diff --exit-code -- assets data GALLERY.md
