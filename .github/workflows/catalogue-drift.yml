name: Monitor MissionChief UK catalogue

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mission-catalogue-drift
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch live UK catalogue
        run: python scripts/sync_catalogue.py
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- data/source/missionchief-uk.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate and validate
        if: steps.drift.outputs.changed == 'true'
        run: |
          python scripts/build_icons.py
          python scripts/validate_pack.py
          python scripts/build_previews.py
          python scripts/package_release.py
      - name: Open validated catalogue update
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/mission-catalogue-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/source data/mission-manifest.json data/mission-manifest.csv data/classifier-profile.json data/qa-report.json assets GALLERY.md dist
          git commit -m "Update MissionChief UK mission catalogue"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Update MissionChief UK mission catalogue" --body "Automated catalogue drift update. All mission mappings, 32×37 state graphics, classification outputs and visibility gates passed before this PR was opened." || gh issue create --title "Mission catalogue drift detected" --body "The validated update branch \`$branch\` was pushed, but Actions could not open a pull request automatically."
